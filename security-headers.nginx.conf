# FIRST CAB — Nginx Security Headers
# Include this in your server {} block:
#   include /path/to/security-headers.nginx.conf;

# Force HTTPS
server {
  listen 80;
  server_name firstcab.in www.firstcab.in;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name firstcab.in www.firstcab.in;

  root /var/www/first-cab-website;
  index index.html;

  # SSL (replace with your actual cert paths)
  ssl_certificate     /etc/ssl/certs/firstcab.crt;
  ssl_certificate_key /etc/ssl/private/firstcab.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # Security Headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://wa.me; frame-src 'self' https://www.google.com https://maps.googleapis.com https://maps.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://formspree.io https://api.emailjs.com;" always;

  # Hide server info
  server_tokens off;

  # Gzip
  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml;
  gzip_vary on;

  # Cache static assets
  location ~* \.(css|js|avif|webp|png|jpg|woff2|woff)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Block dotfiles
  location ~ /\. {
    deny all;
    return 404;
  }

  # Serve SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
